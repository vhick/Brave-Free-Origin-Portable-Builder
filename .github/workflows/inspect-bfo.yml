name: Inspect Brave Free Origin portability

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Source repo (blank = YOUR-USERNAME/Brave-Free-Origin)
        required: false
        default: ""
      source_ref:
        description: Branch, tag, or commit to inspect
        required: false
        default: main

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect upstream PowerShell source
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out builder
        uses: actions/checkout@v7

      - name: Resolve source
        id: source
        shell: pwsh
        env:
          REQUESTED_REPO: ${{ inputs.source_repo }}
          REQUESTED_REF: ${{ inputs.source_ref }}
          DEFAULT_OWNER: ${{ github.repository_owner }}
        run: |
          $repo = $env:REQUESTED_REPO
          if ([string]::IsNullOrWhiteSpace($repo)) {
            $repo = "$env:DEFAULT_OWNER/Brave-Free-Origin"
          }
          $ref = $env:REQUESTED_REF
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = 'main' }
          "repo=$repo" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT
          Write-Host "Inspecting $repo at $ref"

      - name: Check out clean fork
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.ref }}
          path: upstream
          fetch-depth: 1

      - name: Capture source revision
        id: revision
        shell: pwsh
        run: |
          $revision = (git -C upstream rev-parse HEAD).Trim()
          "sha=$revision" >> $env:GITHUB_OUTPUT
          Write-Host "Source SHA: $revision"

      - name: Inspect paths, backups, ownership ledger and launchers
        shell: pwsh
        run: |
          & .\scripts\Inspect-BFO-Portability.ps1 `
            -SourceRoot "$PWD\upstream" `
            -OutputRoot "$PWD\artifact\BFO-Inspection"

      - name: Upload source-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brave-Free-Origin-Inspection-${{ steps.revision.outputs.sha }}
          path: artifact/BFO-Inspection/**
          if-no-files-found: error
          retention-days: 30
